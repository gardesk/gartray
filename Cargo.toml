[workspace]
members = ["gartray", "gartrayctl"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mfwolffe/gartray"

[workspace.dependencies]
# UI toolkit
gartk-core = { path = "../gartk/gartk-core" }
gartk-x11 = { path = "../gartk/gartk-x11" }
gartk-render = { path = "../gartk/gartk-render" }

# X11
x11rb = { version = "0.13", features = ["allow-unsafe-code", "randr"] }

# D-Bus
zbus = "4"

# Async runtime
tokio = { version = "1", features = ["full", "signal"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# CLI
clap = { version = "4.0", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Audio (PulseAudio)
libpulse-binding = "2.0"

# Utilities
dirs = "5.0"
shellexpand = "3.0"
